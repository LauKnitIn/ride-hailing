server:
  port: 8082

spring:
  application:
    name: viajes-service
  datasource:
    url: jdbc:postgresql://localhost:5434/viajes
    username: viajes
    password: viajes
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  grpc:
    server:
      port: 9192
    client:
      channel:
        pasajeros:
          target: static://localhost:9193  
        conductores:
          target: static://localhost:9191