syntax = "proto3";

option java_package = "com.ride_hailing.viajes.grpc";
option java_multiple_files = true;
option java_outer_classname = "PasajeroProto";

service PasajeroGrpc {
  rpc ExistePasajero (PasajeroRequest) returns (PasajeroResponse) {}
}

message PasajeroRequest {
  string pasajeroId = 1;
}

message PasajeroResponse {
  bool existe = 1;
  string nombre = 2;
}