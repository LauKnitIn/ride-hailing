server:
  port: 8085

spring:
  application:
    name: conductores-service
  datasource:
    url: jdbc:postgresql://localhost:5433/conductores
    username: conductores
    password: conductores
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: conductores-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: batch

grpc:
  server:
    port: 9191
  client:
    channel:
      viajes:
        target: static://localhost:9192

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
